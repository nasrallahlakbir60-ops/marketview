# Production : docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Seul Nginx (frontend) est exposé ; PostgreSQL et Redis restent sur le réseau interne.
# HTTPS : placer un reverse proxy TLS devant le port 80 (voir README, section Déploiement).

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL manquante dans .env}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
  NEWSAPI_KEY: ${NEWSAPI_KEY:-}
  MARKETAUX_KEY: ${MARKETAUX_KEY:-}
  FRED_API_KEY: ${FRED_API_KEY:-}
  TRADINGECONOMICS_KEY: ${TRADINGECONOMICS_KEY:-}
  TWELVEDATA_KEY: ${TWELVEDATA_KEY:-}
  JWT_SECRET: ${JWT_SECRET:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
  NEWS_FETCH_INTERVAL_SECONDS: ${NEWS_FETCH_INTERVAL_SECONDS:-60}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketview}
      POSTGRES_USER: ${POSTGRES_USER:-marketview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquante dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketview} -d ${POSTGRES_DB:-marketview}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      <<: *backend-env
      RUN_SCHEDULER: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Tâches planifiées (news 60 s, macro 1/jour, calendrier 1/h) dans un processus unique.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    command: ["python", "-m", "app.workers.scheduler"]
    environment:
      <<: *backend-env
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
