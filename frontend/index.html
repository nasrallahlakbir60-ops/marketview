<!doctype html>
<html class="dark" lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101713" />
    <meta
      name="description"
      content="MarketView, une vue claire sur les marchés et les graphiques."
    />
    <title>MarketView — Marchés & graphiques</title>
    <script>
      // Applique le thème mémorisé avant l'affichage (évite un flash de l'autre thème).
      try {
        if (localStorage.getItem("marketview-theme") === "light") {
          document.documentElement.classList.remove("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#f4f6f2");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
